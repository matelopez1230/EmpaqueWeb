{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('pdf_generator.panel') }}" class="btn btn-secondary mr-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h2 style="color: #2c3e50; margin: 0;">
            <i class="{{ tipo_info.icono }} mr-2 text-{{ tipo_info.color }}"></i>
            {{ tipo_info.nombre }}
        </h2>
    </div>

    <div class="card card-custom">
        <div class="card-header bg-primary-custom text-white">
            <h5 class="mb-0"><i class="fas fa-edit mr-2"></i>Datos del documento</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('pdf_generator.generar', tipo=tipo) }}">

                <div class="alert alert-light border">
                    <strong><i class="fas fa-code-branch mr-1"></i>Identificación y versión</strong>
                    <div class="form-row mt-2">
                        <div class="form-group col-md-3 mb-0">
                            <label>Código base <span class="text-danger">*</span></label>
                            <input type="text" name="codigo_base" class="form-control input-custom"
                                   placeholder="Ej: CAJ03" required
                                   value="{{ prefill.codigo_base if prefill else '' }}"
                                   oninput="actualizarCodigo()">
                        </div>
                        <div class="form-group col-md-2 mb-0">
                            <label>Variante</label>
                            <input type="text" name="variante" id="input-variante"
                                   class="form-control input-custom" maxlength="3"
                                   placeholder="A"
                                   value="{{ prefill.variante if prefill else '' }}"
                                   oninput="actualizarCodigo()">
                        </div>
                        <div class="form-group col-md-2 mb-0">
                            <label>Revisión</label>
                            <input type="number" name="revision" class="form-control input-custom"
                                   min="0" max="99"
                                   value="{{ prefill.revision if prefill else 0 }}">
                        </div>
                        <div class="form-group col-md-5 mb-0">
                            <label>Código completo</label>
                            <input type="text" id="codigo-preview"
                                   class="form-control input-custom bg-light" disabled>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label>Cliente</label>
                        <input type="text" name="cliente" class="form-control input-custom"
                               value="{{ prefill.cliente if prefill else '' }}">
                    </div>
                    <div class="form-group col-md-4">
                        <label>Producto / Artículo</label>
                        <input type="text" name="producto" class="form-control input-custom"
                               value="{{ prefill.producto if prefill else '' }}">
                    </div>
                    <div class="form-group col-md-4">
                        <label>Título / Descripción</label>
                        <input type="text" name="titulo" class="form-control input-custom"
                               value="{{ prefill.titulo if prefill else '' }}">
                    </div>
                </div>

                <div class="alert alert-light border">
                    <strong><i class="fas fa-info-circle mr-1"></i>{{ tipo_info.nombre }}</strong>
                    <p class="mb-0 small">Los campos específicos se agregarán cuando definas el detalle.</p>
                </div>

                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea name="observaciones" class="form-control input-custom" rows="3">{{ prefill.observaciones if prefill else '' }}</textarea>
                </div>

                <div class="text-right">
                    <a href="{{ url_for('pdf_generator.panel') }}" class="btn btn-secondary">
                        <i class="fas fa-times mr-1"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger-custom">
                        <i class="fas fa-file-pdf mr-1"></i>Generar PDF
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function actualizarCodigo() {
    var base = document.querySelector('[name="codigo_base"]').value.toUpperCase();
    var vari = document.getElementById('input-variante').value.toUpperCase();
    document.getElementById('codigo-preview').value = (base + vari) || '—';
}
document.addEventListener('DOMContentLoaded', actualizarCodigo);
</script>
{% endblock %}
