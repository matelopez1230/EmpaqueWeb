{% extends "base.html" %}

{% block content %}
<div class="container-fluid" style="max-width: 800px; margin: 0 auto;">
    <h2 class="mb-4 text-center" style="color: #2c3e50;">
        <i class="fas fa-box-open mr-2"></i>Módulo de Pickeo
    </h2>

    <!-- Paso 1: Seleccionar Empaque -->
    <div class="card card-custom mb-4">
        <div class="card-header bg-primary-custom text-white">
            <h5 class="mb-0"><i class="fas fa-tasks mr-2"></i>1. Seleccionar Empaque</h5>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label for="select-empaque" class="font-weight-bold">Número de Empaque:</label>
                <select id="select-empaque" class="form-control input-custom" style="height: auto; min-height: 45px; padding: 8px 12px; font-size: 1rem;">
                    <option value="">Cargando empaques...</option>
                </select>
            </div>
            
            <div id="info-empaque" style="display: none;">
                <hr>
                <div class="alert alert-info">
                    <strong><i class="fas fa-user mr-2"></i>Cliente:</strong> <span id="cliente-empaque"></span><br>
                    <strong><i class="fas fa-map-marker-alt mr-2"></i>Dirección:</strong> <span id="direccion-empaque"></span><br>
                    <strong><i class="fas fa-boxes mr-2"></i>Estado:</strong> <span id="estado-empaque" class="badge badge-warning"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Paso 2: Seleccionar Pallet -->
    <div class="card card-custom mb-4" id="pallets-container" style="display: none;">
        <div class="card-header bg-success-custom text-white">
            <h5 class="mb-0"><i class="fas fa-pallet mr-2"></i>2. Seleccionar Pallet</h5>
        </div>
        <div class="card-body">
            <div id="pallets-lista" class="list-group">
                <div class="list-group-item text-center">Cargando pallets...</div>
            </div>
        </div>
    </div>

    <!-- Paso 3: Productos a Pickear -->
    <div class="card card-custom" id="productos-container" style="display: none;">
        <div class="card-header bg-info-custom text-white">
            <h5 class="mb-0"><i class="fas fa-list mr-2"></i>3. Productos a Pickear</h5>
        </div>
        <div class="card-body">
            <div id="productos-lista" class="list-group list-group-flush">
                <div class="list-group-item text-center">Seleccione un pallet</div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para escanear QR y registrar cantidad -->
<div class="modal fade" id="modalPick" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary-custom text-white">
                <h5 class="modal-title"><i class="fas fa-qrcode mr-2"></i>Registrar Pickeo</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <span class="badge badge-info p-2" id="modal-producto-info"></span>
                </div>
                
                <div class="form-group">
                    <label for="nro-of" class="font-weight-bold">
                        <i class="fas fa-qrcode mr-1"></i>Código QR (N° Lote/OF):
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control input-custom" 
                               id="nro-of" placeholder="Escaneá o ingresá el código" autofocus>
                        <div class="input-group-append">
                            <button class="btn btn-primary-custom" type="button" id="btn-escanear-qr" style="display: none;">
                                <i class="fas fa-camera"></i> Escanear
                            </button>
                        </div>
                    </div>
                </div>
                
                <div id="qr-reader-container" style="display: none;">
                    <div id="qr-reader" style="width: 100%;"></div>
                    <button type="button" class="btn btn-sm btn-secondary mt-2" id="btn-cerrar-camara">
                        <i class="fas fa-times mr-1"></i>Cerrar cámara
                    </button>
                </div>
                
                <div class="form-group">
                    <label for="cantidad-pick" class="font-weight-bold">
                        <i class="fas fa-sort-amount-up mr-1"></i>Cantidad:
                    </label>
                    <input type="number" class="form-control input-custom" 
                           id="cantidad-pick" step="0.01" min="0.01" value="1">
                </div>
                
                <div id="lote-info" class="small text-muted mt-2"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                    <i class="fas fa-times mr-1"></i>Cancelar
                </button>
                <button type="button" class="btn btn-success-custom" id="btn-confirmar-pick">
                    <i class="fas fa-check mr-1"></i>Confirmar Pickeo
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Template para item de producto -->
<template id="template-producto">
    <div class="list-group-item producto-item">
        <div class="d-flex w-100 justify-content-between align-items-center">
            <div>
                <h6 class="mb-1 font-weight-bold codart-text"></h6>
                <p class="mb-1 descripcion-text"></p>
                <small class="text-muted">
                    <i class="fas fa-cube mr-1"></i>Requerido: <span class="requerido-text"></span>
                    | Pickeado: <span class="pickeado-text"></span>
                    | <span class="pendiente-text text-primary"></span>
                </small>
                <small class="text-muted d-block">
                    <i class="fas fa-pallet mr-1"></i>Pallet N°: <span class="pallet-text"></span>
                    <span class="badge ml-2 tipo-producto"></span>
                </small>
            </div>
            <span class="badge estado-badge">PENDIENTE</span>
        </div>
        <button class="btn btn-sm btn-pickear mt-2" data-id="">
            <i class="fas fa-qrcode mr-1"></i>Pickear
        </button>
    </div>
</template>

<!-- Modal para ver productos pickeados -->
<div class="modal fade" id="modalPickeado" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">
                    <i class="fas fa-check-circle"></i> Productos Pickeados
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Contenido cargado vía AJAX -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Librería para escanear QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
function verPickeado(idPallet) {
    $('#modalPickeado .modal-body').html('<div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Cargando...</p></div>');
    $('#modalPickeado').modal('show');
    
        $.ajax({
            url: '/picking/productos-pickeado/' + idPallet,
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                if (data.length === 0) {
                    $('#modalPickeado .modal-body').html('<div class="text-center text-muted"><i class="fas fa-box-open fa-3x"></i><p>No hay productos pickeados en este pallet</p></div>');
                    return;
                }
                
                var html = `
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered">
                            <thead class="thead-dark">
                                <tr>
                                    <th>Código</th>
                                    <th>Descripción</th>
                                    <th class="text-center">Pedido</th>
                                    <th class="text-center">Pickeado</th>
                                    <th class="text-center">Falta</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                var totalPedido = 0;
                var totalPickeado = 0;
                var totalDiferencia = 0;
                
                data.forEach(function(prod) {
                    totalPedido += prod.cantidad_pedida;
                    totalPickeado += prod.cantidad_pickeada;
                    totalDiferencia += prod.diferencia;
                    
                    var badgeColor = prod.diferencia === 0 ? 'success' : 'warning';
                    
                    html += `
                        <tr>
                            <td><strong>${prod.codart}</strong></td>
                            <td>${prod.descripcion}</td>
                            <td class="text-center"><strong>${prod.cantidad_pedida}</strong></td>
                            <td class="text-center"><span class="badge badge-success">${prod.cantidad_pickeada}</span></td>
                            <td class="text-center"><span class="badge badge-${badgeColor}">${prod.diferencia}</span></td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                        </table>
                    </div>
                    <div class="alert alert-info">
                        <strong>📦 Resumen:</strong>
                        Pedido: ${totalPedido} | 
                        Pickeado: ${totalPickeado} | 
                        <span class="${totalDiferencia === 0 ? 'text-success' : 'text-warning'}">
                            Falta: ${totalDiferencia}
                        </span>
                    </div>
                `;
                
                $('#modalPickeado .modal-body').html(html);
            },
            error: function() {
                $('#modalPickeado .modal-body').html('<div class="alert alert-danger">Error al cargar los productos pickeados</div>');
            }
        });
    }


document.addEventListener('DOMContentLoaded', function() {
    if (typeof $ === 'undefined') {
        console.error('jQuery no está cargado');
        return;
    }
    
    console.log('Módulo de pickeo iniciado');
    
    var empaqueSeleccionado = null;
    var palletSeleccionado = null;
    var productoSeleccionado = null;
    var html5QrCode = null;
    var scannerActivo = false;
    
    // Función para iniciar el escáner QR
    function iniciarEscanner() {
        if (scannerActivo) {
            detenerEscanner();
        }
        
        const readerContainer = document.getElementById("qr-reader-container");
        const readerElement = document.getElementById("qr-reader");
        
        readerContainer.style.display = "block";
        readerElement.innerHTML = "";
        
        html5QrCode = new Html5Qrcode("qr-reader");
        
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => {
                document.getElementById("nro-of").value = decodedText;
                detenerEscanner();
                $('#nro-of').trigger('change');
                $('#lote-info').html(`<span class="text-success">Código escaneado: ${decodedText}</span>`);
            },
            (errorMessage) => {
                console.log("Error de lectura:", errorMessage);
            }
        ).catch(err => {
            console.log("Error al iniciar cámara", err);
            alert("No se pudo acceder a la cámara. Verificá los permisos.");
            detenerEscanner();
        });
        
        scannerActivo = true;
    }
    
    function detenerEscanner() {
        if (html5QrCode && scannerActivo) {
            html5QrCode.stop().then(() => {
                document.getElementById("qr-reader-container").style.display = "none";
                scannerActivo = false;
            }).catch(err => console.log("Error al detener cámara", err));
        } else {
            document.getElementById("qr-reader-container").style.display = "none";
            scannerActivo = false;
        }
    }
    
    $('#btn-escanear-qr').on('click', iniciarEscanner);
    $('#btn-cerrar-camara').on('click', detenerEscanner);
    $('#modalPick').on('hidden.bs.modal', detenerEscanner);
    
    // Cargar empaques disponibles
    function cargarEmpaques() {
        console.log('Cargando empaques...');
        $.get('/picking/empaques-disponibles')
            .done(function(data) {
                console.log('Respuesta recibida:', data);
                var select = $('#select-empaque');
                select.empty();
                select.append('<option value="">Seleccionar empaque...</option>');
                
                if (!data || data.length === 0) {
                    select.append('<option value="" disabled>No hay empaques pendiente de pickeo</option>');
                    return;
                }
                
                data.forEach(function(emp) {
                    var cliente = emp.cliente || 'Sin cliente';
                    var numero = emp.numero || 'Sin número';
                    var estado = emp.estado || 'PENDIENTE';
                    
                    select.append(`
                        <option value="${emp.id}" data-cliente="${cliente}" 
                                data-direccion="${emp.direccion}" data-estado="${estado}">
                            ${numero} - ${cliente.substring(0,30)}... (${estado})
                        </option>
                    `);
                });
            })
            .fail(function(xhr) {
                console.error('Error al cargar empaques:', xhr.status);
                $('#select-empaque').empty().append('<option value="">Error al cargar empaques</option>');
            });
    }
    
    // Cargar pallets del empaque
    function cargarPallets(id_empaque) {
    $('#pallets-lista').html('<div class="list-group-item text-center"><i class="fas fa-spinner fa-spin"></i> Cargando pallets...</div>');
    $('#productos-container').hide();
    $('#productos-lista').empty();
    
    $.get(`/picking/pallets-empaque/${id_empaque}`)
        .done(function(data) {
            var container = $('#pallets-lista');
            container.empty();
            
            if (!data || data.length === 0) {
                container.html('<div class="list-group-item text-center text-muted">No hay pallets asignados para este empaque</div>');
                $('#pallets-container').show();
                return;
            }
            
            data.forEach(function(pal) {
                var completado = pal.control_estado === 'VERIFICADO';
                var progreso = pal.total_productos > 0 ? Math.round((pal.productos_completados / pal.total_productos) * 100) : 0;
                
                container.append(`
                    <div class="list-group-item pallet-item ${completado ? 'list-group-item-success' : ''}" 
                        data-id="${pal.id}" data-numero="${pal.numero}" data-control="${pal.control_estado}"
                        style="cursor: pointer;">
                        
                        <!-- Fila 1: Número de Pallet + Estado + Botón -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div class="d-flex align-items-center">
                                <strong class="mr-3">Pallet N° ${pal.numero}</strong>
                                <!-- 🔥 BOTÓN VER PICKEADO -->
                                <button class="btn btn-sm btn-info" onclick="verPickeado(${pal.id}); event.stopPropagation();" title="Ver productos ya pickeados">
                                    <i class="fas fa-eye"></i> Ver Pickeado
                                </button>
                            </div>
                            ${completado ? '<span class="badge badge-success">Verificado</span>' : '<span class="badge badge-warning">Pendiente</span>'}
                        </div>
                        
                        <!-- Fila 2: Barra de progreso -->
                        <div class="progress mt-1" style="height: 5px; width: 100%;">
                            <div class="progress-bar bg-success" style="width: ${progreso}%"></div>
                        </div>
                        
                        <!-- Fila 3: Datos del pallet -->
                        <div class="row mt-1">
                            <div class="col-4">
                                <small>Productos: ${pal.productos_completados}/${pal.total_productos}</small>
                            </div>
                            <div class="col-4">
                                <small>Bultos: ${pal.total_bultos || 0}</small>
                            </div>
                            <div class="col-4">
                                <small>Peso: ${pal.peso_total?.toFixed(2) || 0} kg</small>
                            </div>
                        </div>
                    </div>
                `);
            });

            $('#pallets-container').show();
        })
        .fail(function() {
            $('#pallets-lista').html('<div class="list-group-item text-center text-danger">Error al cargar pallets</div>');
        });
    }
        
    // Cargar productos de un pallet
    function cargarProductosPallet(id_pallet) {
    $('#productos-lista').html('<div class="list-group-item text-center"><i class="fas fa-spinner fa-spin"></i> Cargando productos...</div>');
    $('#productos-container').show();
    
    $.get(`/picking/productos-pallet/${id_pallet}`)
        .done(function(data) {
            var container = $('#productos-lista');
            container.empty();
            
            if (!data || data.length === 0) {
                container.html('<div class="list-group-item text-center text-success">Todos los productos de este pallet están completados</div>');
                return;
            }
            
            data.forEach(function(prod) {
                var template = $('#template-producto').html();
                var item = $(template);
                
                item.find('.codart-text').text(prod.codart);
                item.find('.descripcion-text').text(prod.descripcion);
                item.find('.requerido-text').text(prod.requerido);
                item.find('.pickeado-text').text(prod.pickeado);
                item.find('.pendiente-text').text(`Pendiente: ${prod.pendiente}`);
                
                // 🔥 Mostrar tipo de producto
                var tipoBadge = item.find('.tipo-producto');
                // Obtener codtipart del detalle (por defecto PT)
                var codtipart = prod.codtipart || 'PT';
                var esPT = codtipart === 'PT';
                tipoBadge.text(esPT ? 'PT - Requiere lote' : 'Sin lote - Lote fijo');
                tipoBadge.addClass(esPT ? 'badge-warning' : 'badge-secondary');
                
                var badge = item.find('.estado-badge');
                var estado = prod.pendiente <= 0 ? 'COMPLETADO' : (prod.pickeado > 0 ? 'PARCIAL' : 'PENDIENTE');
                badge.text(estado);
                if (estado === 'COMPLETADO') {
                    badge.addClass('badge-success');
                } else if (estado === 'PARCIAL') {
                    badge.addClass('badge-warning');
                } else {
                    badge.addClass('badge-secondary');
                }
                
                var btnPickear = item.find('.btn-pickear');
                btnPickear.data('id-pallet-detalle', prod.id_pallet_detalle);
                btnPickear.data('id-empaque-detalle', prod.id_empaque_detalle);
                btnPickear.data('codart', prod.codart);
                btnPickear.data('descripcion', prod.descripcion);
                btnPickear.data('pendiente', prod.pendiente);
                btnPickear.data('pallet', palletSeleccionado);
                btnPickear.data('codtipart', codtipart);  // 🔥 Guardar codtipart
                
                if (estado === 'COMPLETADO') {
                    btnPickear.prop('disabled', true);
                    btnPickear.removeClass('btn-primary-custom').addClass('btn-secondary');
                    btnPickear.html('<i class="fas fa-check mr-1"></i>Completado');
                } else {
                    btnPickear.addClass('btn-primary-custom');
                    btnPickear.html('<i class="fas fa-qrcode mr-1"></i>Pickear');
                }
                
                container.append(item);
            });
        })
        .fail(function() {
            $('#productos-lista').html('<div class="list-group-item text-center text-danger">Error al cargar productos</div>');
        });
    }

    
    
    // Evento: cambio de empaque
    $('#select-empaque').on('change', function() {
        var id = $(this).val();
        var selected = $(this).find(':selected');
        
        if (id) {
            empaqueSeleccionado = id;
            $('#info-empaque').show();
            $('#cliente-empaque').text(selected.data('cliente'));
            $('#direccion-empaque').text(selected.data('direccion'));
            $('#estado-empaque').text(selected.data('estado'));
            cargarPallets(id);
        } else {
            $('#info-empaque').hide();
            $('#pallets-container').hide();
            $('#productos-container').hide();
        }
    });
    
    // Evento: seleccionar pallet
    $(document).on('click', '.pallet-item', function() {
        if ($(this).data('control') === 'VERIFICADO') {
            alert('Este pallet ya fue verificado completamente');
            return;
        }
        
        $('.pallet-item').removeClass('active');
        $(this).addClass('active');
        palletSeleccionado = $(this).data('id');
        cargarProductosPallet(palletSeleccionado);
    });
    
    // Evento: pickear producto
    $(document).on('click', '.btn-pickear', function() {
    if ($(this).prop('disabled')) return;
    
    var codtipart = $(this).data('codtipart') || 'PT';
    var esPT = codtipart === 'PT';
    
    productoSeleccionado = {
        id_pallet_detalle: $(this).data('id-pallet-detalle'),
        id_empaque_detalle: $(this).data('id-empaque-detalle'),
        codart: $(this).data('codart'),
        descripcion: $(this).data('descripcion'),
        pendiente: $(this).data('pendiente'),
        pallet: $(this).data('pallet'),
        codtipart: codtipart
    };
    
    $('#modal-producto-info').text(`${productoSeleccionado.codart} - ${productoSeleccionado.descripcion}`);
    
    // 🔥 Comportamiento según tipo de producto
    if (esPT) {
        // PT: campo habilitado, normal
        $('#nro-of').prop('disabled', false);
        $('#nro-of').val('');
        $('#nro-of').attr('placeholder', 'Escaneá o ingresá el código');
        $('#btn-escanear-qr').show();
        $('#lote-info').html('<span class="text-info">Ingrese el lote del producto</span>');
    } else {
        // No PT: campo bloqueado con lote fijo
        $('#nro-of').prop('disabled', true);
        $('#nro-of').val('2-00001');
        $('#nro-of').attr('placeholder', 'Lote fijo para productos sin lote');
        $('#btn-escanear-qr').hide();
        $('#lote-info').html('<span class="text-secondary">Lote fijo asignado automáticamente</span>');
    }
    
        $('#cantidad-pick').val(productoSeleccionado.pendiente > 1 ? 1 : productoSeleccionado.pendiente);
        $('#modalPick').modal('show');
    });
        
    // Verificar lote
    $('#nro-of').on('change', function() {
        var nro = $(this).val();
        if (nro && productoSeleccionado) {
            var esPT = productoSeleccionado.codtipart === 'PT';
            if (!esPT) {
                // Si no es PT, no validar lote
                return;
            }
            
            $.ajax({
                url: '/picking/verificar-lote',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    nro_of: nro,
                    codart: productoSeleccionado.codart
                }),
                success: function(data) {
                    if (data.success) {
                        $('#lote-info').html(`<span class="text-success">Lote válido - Disponible: ${data.disponible}</span>`);
                    } else {
                        $('#lote-info').html(`<span class="text-danger">${data.error}</span>`);
                    }
                }
            });
        }
    });
    
    // Confirmar pickeo
    $('#btn-confirmar-pick').on('click', function() {
        var nro_of = $('#nro-of').val();
        var cantidad = parseFloat($('#cantidad-pick').val());
        var esPT = productoSeleccionado.codtipart === 'PT';
        
        console.log('=== DEBUG PICKEO ===');
        console.log('id_pallet_detalle:', productoSeleccionado.id_pallet_detalle);
        console.log('id_empaque_detalle:', productoSeleccionado.id_empaque_detalle);
        console.log('nro_of:', nro_of);
        console.log('cantidad:', cantidad);
        console.log('codtipart:', productoSeleccionado.codtipart);
        
        // 🔥 Validación de lote según tipo
        if (esPT) {
            if (!nro_of || nro_of.trim() === '') {
                alert('Debe ingresar un número de lote/OF');
                return;
            }
        } else {
            // Forzar lote fijo si no es PT
            nro_of = '2-00001';
            $('#nro-of').val(nro_of);
        }
        
        if (!cantidad || cantidad <= 0) {
            alert('Debe ingresar una cantidad válida');
            return;
        }
        
        if (cantidad > productoSeleccionado.pendiente) {
            alert(`La cantidad no puede superar el pendiente (${productoSeleccionado.pendiente})`);
            return;
        }
        
        var datosEnvio = {
            id_pallet_detalle: productoSeleccionado.id_pallet_detalle,
            id_empaque_detalle: productoSeleccionado.id_empaque_detalle,
            nro_of: nro_of,
            cantidad: cantidad,
            codtipart: productoSeleccionado.codtipart
        };
        
        console.log('Enviando al servidor:', datosEnvio);
        
        $(this).prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-1"></i>Procesando...');
        
        $.ajax({
            url: '/picking/registrar-pick',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(datosEnvio),
            success: function(response) {
                console.log('Respuesta del servidor:', response);
                if (response.success) {
                    $('#modalPick').modal('hide');
                    if (palletSeleccionado) {
                        cargarProductosPallet(palletSeleccionado);
                    }
                    if (empaqueSeleccionado) {
                        cargarPallets(empaqueSeleccionado);
                    }
                    alert('Pickeo registrado exitosamente');
                } else {
                    alert('Error: ' + response.error);
                }
            },
            error: function(xhr) {
                console.error('Error de comunicación:', xhr.status);
                alert('Error de comunicación');
            },
            complete: function() {
                $('#btn-confirmar-pick').prop('disabled', false).html('<i class="fas fa-check mr-1"></i>Confirmar Pickeo');
            }
        });
    });
    
    cargarEmpaques();
});
</script>
{% endblock %}
